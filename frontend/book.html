    <style>
      /* Tokens from DESIGN_SPEC.md */
      :root{--fox:#FB471B;--fox-accent:#FC6C4C;--ink:#15213A;--bg:#F7F8FA;--card:#FFFFFF;--fill:#F2F4F7;
        --text:#1A1D21;--text-2:#667085;--muted:#98A2B3;--border:#E6E8EC;--border-strong:#D0D5DD;}
      *{box-sizing:border-box;} html,body{margin:0;}
      body{background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;}
      .wrap{max-width:760px;margin:0 auto;padding:0 20px;}
      :focus-visible{outline:3px solid var(--fox);outline-offset:2px;border-radius:6px;}
      .intro{padding:34px 0 10px;}
      .intro .eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fox);margin-bottom:10px;}
      .intro h1{font-size:clamp(26px,4vw,36px);line-height:1.08;margin:0 0 8px;}
      .intro p{font-size:16.5px;color:var(--text-2);margin:0;}
      .book{padding:22px 0 64px;}
      .steps{display:flex;gap:6px;margin:0 0 22px;}
      .steps .s{flex:1;text-align:center;}
      .steps .bar{height:4px;border-radius:2px;background:#e2e5eb;margin-bottom:6px;}
      .steps .s.done .bar,.steps .s.active .bar{background:var(--fox);}
      .steps .lbl{font-size:11px;color:var(--muted);font-weight:600;}
      .steps .s.active .lbl,.steps .s.done .lbl{color:var(--fox);}
      .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 2px 10px rgba(21,33,58,.04);}
      .card h2{font-size:20px;margin:0 0 6px;}
      .card .sub{color:var(--text-2);font-size:13.5px;margin:0 0 18px;}
      .typerow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
      .typebtn{padding:10px 16px;border-radius:999px;border:2px solid var(--border);background:#fff;color:var(--text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;}
      .typebtn[aria-pressed="true"]{border-color:var(--fox);background:#fff7f4;color:var(--ink);}
      .grid-dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
      .datebtn{padding:14px;border-radius:12px;border:2px solid var(--border);background:#fff;cursor:pointer;text-align:center;font:inherit;}
      .datebtn:hover{border-color:var(--fox-accent);}
      .datebtn .dn{font-size:13px;font-weight:700;color:var(--ink);}
      .datebtn .dd{font-size:12px;color:var(--text-2);}
      .datebtn .dc{font-size:10px;color:var(--muted);margin-top:4px;}
      .grid-times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
      @media (max-width:520px){.grid-times{grid-template-columns:repeat(3,1fr);}}
      .timebtn{padding:12px;border-radius:12px;border:2px solid var(--border);background:#fff;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
      .timebtn:hover,.timebtn[aria-pressed="true"]{border-color:var(--fox);background:#fff7f4;}
      .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
      @media (max-width:560px){.fields{grid-template-columns:1fr;}}
      .fld label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:0 0 4px;}
      .fld input,.fld textarea{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border-strong);font:inherit;font-size:14px;background:#fff;color:var(--text);}
      .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--fox);}
      .fld.full{grid-column:1/-1;}
      .review{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
      .review .r{padding:8px 0;border-bottom:1px solid var(--fill);}
      .review .r .k{font-size:11px;color:var(--muted);}
      .review .r .v{font-size:14px;font-weight:600;color:var(--text);}
      .note{padding:12px;background:var(--fill);border-radius:10px;font-size:13px;margin-bottom:16px;}
      .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:13px 26px;text-decoration:none;}
      .btn--primary{background:var(--fox);color:#fff;}
      .btn--primary:hover{background:var(--fox-accent);}
      .btn--primary[disabled]{background:#e2e5eb;color:var(--muted);cursor:default;}
      .btn--ghost{background:#fff;border:1px solid var(--border-strong);color:var(--text);}
      .btn--sm{padding:10px 18px;font-size:14px;}
      .done{text-align:center;padding:26px 10px;}
      .done .tick{width:62px;height:62px;border-radius:50%;background:#e8f6ee;color:#16a34a;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
      .done .tick svg{width:30px;height:30px;}
      .done h2{font-size:24px;margin:0 0 8px;}
      .done p{color:var(--text-2);margin:0 auto;max-width:42ch;}
      .fallback{text-align:center;padding:14px 0 0;}
      .fallback .muted{color:var(--text-2);font-size:13.5px;margin:10px 0 0;}
      .foot{border-top:1px solid var(--border);text-align:center;padding:22px;font-size:12.5px;color:var(--muted);}
      .trust{display:inline-flex;gap:14px;flex-wrap:wrap;color:var(--text-2);font-size:13px;margin-top:12px;}
      .trust b{color:var(--ink);}
    </style>

  <body>
    <main>
      <section class="intro"><div class="wrap">
        <span class="eyebrow">Free IT review</span>
        <h1>Book a conversation</h1>
        <p>A relaxed 15-minute call — no obligation, no hard sell. Pick a time that suits you.</p>
        <div class="trust"><span>✓ <b>No obligation</b></span><span>✓ <b>15 minutes</b></span><span>✓ <b>A time that suits you</b></span></div>
      </div></section>

      <section class="book"><div class="wrap">
        <div id="fox-book" aria-live="polite">
          <div class="card"><p class="sub" style="margin:0">Loading available times…</p></div>
        </div>
      </div></section>
    </main>

    <footer class="foot">© <span id="yr"></span> Fox ITC · <a href="https://www.foxitc.co.uk" style="color:inherit">foxitc.co.uk</a> · Booking powered by Fox 360</footer>

    <script>
    (function(){
      var API="https://360.foxitc.co.uk";
      var root=document.getElementById("fox-book");
      document.getElementById("yr").textContent=new Date().getFullYear();
      var qpType=(function(){try{return new URLSearchParams(location.search).get("type")||"discovery";}catch(e){return "discovery";}})();
      var st={types:[],meetingType:qpType,slots:[],date:null,time:null,step:1,done:false,booking:false,errored:false,
              form:{name:"",email:"",company:"",phone:"",subject:""},company:"Fox ITC"};
      function esc(s){var d=document.createElement("div");d.textContent=(s==null?"":s);return d.innerHTML;}
      function fmtLong(d){try{return new Date(d+"T00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}catch(e){return d;}}
      function fmtMed(d){try{return new Date(d+"T00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});}catch(e){return d;}}
      function typeLabel(){var t=st.types.filter(function(x){return x.key===st.meetingType;})[0];return (t&&t.label)||"IT review";}

      function stepsBar(){
        var names=["Date","Time","Details","Confirm"],h="";
        for(var i=0;i<4;i++){var cls=st.step>i+1?"done":(st.step===i+1?"active":"");
          h+='<div class="s '+cls+'"><div class="bar"></div><span class="lbl">'+names[i]+'</span></div>';}
        return '<div class="steps">'+h+'</div>';
      }
      function fallbackCard(msg){
        return '<div class="card"><h2>Let’s get you booked in</h2>'+
          '<p class="sub">'+(msg||"We couldn’t load live times just now.")+' You can still book in a couple of clicks on our secure booking page, or email us and we’ll find a time.</p>'+
          '<div class="fallback"><a class="btn btn--primary" href="'+API+'/book?type='+encodeURIComponent(st.meetingType)+'">Open the booking page →</a>'+
          '<p class="muted">Prefer email? <a href="mailto:ian@foxitc.co.uk" style="color:var(--fox)">ian@foxitc.co.uk</a> · 0330 058 1877</p></div></div>';
      }

      function render(){
        if(st.errored){root.innerHTML=fallbackCard();return;}
        if(st.done){
          root.innerHTML='<div class="card"><div class="done">'+
            '<div class="tick" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>'+
            '<h2>You’re booked in</h2>'+
            '<p>'+esc(fmtLong(st.date))+' at <strong>'+esc(st.time)+'</strong>. We’ve sent a calendar invite and confirmation to '+esc(st.form.email)+'. Talk soon!</p>'+
            '</div></div>';
          return;
        }
        var dates=[]; st.slots.forEach(function(s){if(dates.indexOf(s.date)<0)dates.push(s.date);});
        var h=stepsBar();

        if(st.step===1){
          h+='<div class="card">';
          if(st.types.length>1){
            h+='<h2>What would you like to book?</h2><div class="typerow">';
            st.types.forEach(function(t){h+='<button type="button" class="typebtn" data-type="'+esc(t.key)+'" aria-pressed="'+(t.key===st.meetingType)+'">'+esc(t.label)+'</button>';});
            h+='</div>';
          }
          h+='<h2>Choose a date</h2><p class="sub">Showing times when we’re free for your '+esc(typeLabel().toLowerCase())+'.</p>';
          if(!dates.length){ h+='<p class="sub" style="margin:0">Fetching available dates…</p>'; }
          else{
            h+='<div class="grid-dates">';
            dates.forEach(function(d){var day=(st.slots.filter(function(s){return s.date===d;})[0]||{}).day_name||"";
              var cnt=st.slots.filter(function(s){return s.date===d;}).length;
              h+='<button type="button" class="datebtn" data-date="'+esc(d)+'"><span class="dn">'+esc(day)+'</span><span class="dd">'+esc(d)+'</span><span class="dc">'+cnt+' slot'+(cnt===1?'':'s')+'</span></button>';});
            h+='</div>';
          }
          h+='<div class="fallback"><p class="muted">Can’t see a time that works? <a href="mailto:ian@foxitc.co.uk" style="color:var(--fox)">Email us</a> and we’ll sort one.</p></div>';
          h+='</div>';
        }
        else if(st.step===2){
          var times=st.slots.filter(function(s){return s.date===st.date;});
          h+='<div class="card"><h2>Choose a time</h2><p class="sub">'+esc(fmtMed(st.date))+'</p><div class="grid-times">';
          times.forEach(function(s){h+='<button type="button" class="timebtn" data-time="'+esc(s.time)+'">'+esc(s.time)+'</button>';});
          h+='</div><div class="row"><button type="button" class="btn btn--ghost btn--sm" data-back="1">Back</button></div></div>';
        }
        else if(st.step===3){
          var f=st.form;
          h+='<div class="card"><h2>Your details</h2><div class="fields">'+
            fld("name","Name","text",f.name,true)+fld("email","Email","email",f.email,true)+
            fld("company","Company","text",f.company,false)+fld("phone","Phone","tel",f.phone,false)+
            '<div class="fld full"><label for="f-subject">What would you like to discuss?</label><textarea id="f-subject" rows="3" data-field="subject">'+esc(f.subject)+'</textarea></div>'+
            '</div><div class="row"><button type="button" class="btn btn--ghost btn--sm" data-back="2">Back</button>'+
            '<button type="button" class="btn btn--primary btn--sm" data-next="4"'+((f.name&&f.email)?'':' disabled')+'>Review</button></div></div>';
        }
        else if(st.step===4){
          var f2=st.form, rows=[["Date",fmtLong(st.date)],["Time",st.time],["Name",f2.name],["Email",f2.email],["Company",f2.company||"—"],["Phone",f2.phone||"—"]];
          h+='<div class="card"><h2>Confirm your call</h2><div class="review">';
          rows.forEach(function(r){h+='<div class="r"><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>';});
          h+='</div>';
          if(f2.subject) h+='<div class="note">'+esc(f2.subject)+'</div>';
          h+='<div class="row"><button type="button" class="btn btn--ghost btn--sm" data-back="3">Back</button>'+
            '<button type="button" class="btn btn--primary" data-book="1"'+(st.booking?' disabled':'')+'>'+(st.booking?'Booking…':'Confirm booking')+'</button></div></div>';
        }
        root.innerHTML=h;
      }
      function fld(id,label,type,val,req){
        return '<div class="fld"><label for="f-'+id+'">'+label+(req?'':' <span style="font-weight:400;color:var(--muted)">(optional)</span>')+'</label>'+
          '<input id="f-'+id+'" type="'+type+'" data-field="'+id+'" value="'+esc(val)+'"'+(req?' required':'')+' autocomplete="'+(id==="name"?"name":id==="email"?"email":id==="phone"?"tel":id==="company"?"organization":"off")+'" /></div>';
      }

      // Event delegation
      root.addEventListener("click",function(e){
        var t=e.target.closest("button, a"); if(!t) return;
        if(t.dataset.type){st.meetingType=t.dataset.type;st.date=null;st.time=null;loadSlots();render();return;}
        if(t.dataset.date){st.date=t.dataset.date;st.step=2;render();return;}
        if(t.dataset.time){st.time=t.dataset.time;st.step=3;render();return;}
        if(t.dataset.back){st.step=+t.dataset.back;render();return;}
        if(t.dataset.next){st.step=+t.dataset.next;render();return;}
        if(t.dataset.book){doBook();return;}
      });
      root.addEventListener("input",function(e){
        var el=e.target; if(el.dataset&&el.dataset.field){st.form[el.dataset.field]=el.value;
          if(el.dataset.field==="name"||el.dataset.field==="email"){var b=root.querySelector('[data-next]');if(b)b.disabled=!(st.form.name&&st.form.email);}
        }
      });

      function loadSlots(){
        fetch(API+"/api/staff/booking/slots?meeting_type="+encodeURIComponent(st.meetingType))
          .then(function(r){return r.json();}).then(function(d){st.slots=(d&&d.slots)||[];render();})
          .catch(function(){st.errored=true;render();});
      }
      function doBook(){
        if(st.booking)return; st.booking=true; render();
        fetch(API+"/api/staff/booking/book",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({name:st.form.name,email:st.form.email,company:st.form.company,phone:st.form.phone,
            subject:st.form.subject,notes:st.form.subject,date:st.date,time:st.time,meeting_type:st.meetingType})})
          .then(function(r){ if(!r.ok) throw new Error("book failed"); return r.json().catch(function(){return {};}); })
          .then(function(){st.done=true;st.booking=false;render();
            try{gtag('event','booking_complete',{meeting_type:st.meetingType});}catch(e){}})
          .catch(function(){st.booking=false;st.errored=true;render();});
      }
      // Kick off
      fetch(API+"/api/staff/booking/types").then(function(r){return r.json();})
        .then(function(d){st.types=(d&&d.types)||[];if(d&&d.company)st.company=d.company;loadSlots();render();})
        .catch(function(){st.errored=true;render();});
      render();
    })();
    </script>

    <div id="fox-chat"></div>
    <script>
    (function () {
      var URL = "https://360.foxitc.co.uk/ask";
      var open = false, wrap = document.getElementById("fox-chat");
      var panel = document.createElement("iframe");
      panel.src = URL; panel.title = "Chat to Todd";
      panel.style.cssText = "position:fixed;bottom:96px;right:24px;width:380px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 130px);border:0;border-radius:16px;box-shadow:0 16px 50px rgba(0,0,0,.28);z-index:2147483000;display:none;background:#fff;";
      var btn = document.createElement("button");
      btn.setAttribute("aria-label", "Chat to us"); btn.innerHTML = "💬";
      btn.style.cssText = "position:fixed;bottom:24px;right:24px;width:60px;height:60px;border:0;border-radius:50%;background:#FB471B;color:#fff;font-size:26px;cursor:pointer;z-index:2147483001;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;";
      btn.onclick = function () { open = !open; panel.style.display = open ? "block" : "none"; btn.innerHTML = open ? "✕" : "💬"; };
      wrap.appendChild(panel); wrap.appendChild(btn);
    })();
    </script>
  </body>
